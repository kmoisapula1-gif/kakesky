    <!--
      og:url and og:image / twitter:image use paths relative to the page URL.
      Once this site is deployed, replace them with absolute URLs (and add a
      matching <link rel="canonical">) pointing at the production domain —
      social crawlers generally resolve relative OG image paths correctly,
      but the spec calls for absolute ones.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kake Sky Solutions" />
    <meta property="og:title" content="Kake Sky Solutions | Industrial Pallet Lifecycle Management" />

      property="og:description"
      content="Manufacturing, refurbishment, recovery and recycling solutions for industrial supply chains across South Africa."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_ZA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kake Sky Solutions | Industrial Pallet Lifecycle Management" />

      name="twitter:description"
      content="Manufacturing, refurbishment, recovery and recycling solutions for industrial supply chains across South Africa."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap"

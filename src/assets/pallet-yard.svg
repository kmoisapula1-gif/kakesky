<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stacked industrial pallets">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2320"/>
      <stop offset="1" stop-color="#100d0b"/>
    </linearGradient>
    <!-- A single pallet face: outer frame + slat gaps -->
    <pattern id="pallet" width="120" height="70" patternUnits="userSpaceOnUse">
      <rect width="120" height="70" fill="#3a2c20"/>
      <rect x="3" y="3" width="114" height="64" fill="#4a382a"/>
      <!-- vertical block gaps -->
      <rect x="36" y="3" width="10" height="64" fill="#22190f"/>
      <rect x="74" y="3" width="10" height="64" fill="#22190f"/>
      <!-- horizontal deck shadow -->
      <rect x="3" y="30" width="114" height="8" fill="#2c2016"/>
      <rect x="3" y="3" width="114" height="4" fill="#5d4732"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Back rows of stacks -->
  <g opacity="0.7">
    <rect x="60" y="120" width="360" height="640" fill="url(#pallet)"/>
    <rect x="470" y="90" width="360" height="700" fill="url(#pallet)"/>
    <rect x="880" y="120" width="330" height="660" fill="url(#pallet)"/>
    <rect x="1250" y="150" width="300" height="620" fill="url(#pallet)"/>
  </g>

  <!-- Column separators / aisles -->
  <g fill="#0d0a08" opacity="0.55">
    <rect x="420" y="90" width="50" height="700"/>
    <rect x="830" y="90" width="50" height="700"/>
    <rect x="1210" y="120" width="40" height="670"/>
  </g>

  <!-- Foreground taller stack, right side -->
  <g opacity="0.92">
    <rect x="1080" y="40" width="470" height="840" fill="url(#pallet)"/>
    <rect x="1080" y="40" width="470" height="8" fill="#6b5137"/>
  </g>

  <!-- Warm rim light from the right -->
  <rect width="1600" height="900" fill="url(#glow)"/>
  <radialGradient id="glow" cx="0.85" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#c87040" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#c87040" stop-opacity="0"/>
  </radialGradient>

  <!-- Ground haze -->
  <rect x="0" y="720" width="1600" height="180" fill="#000000" opacity="0.5"/>
</svg>
